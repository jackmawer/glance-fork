name: Tests

on:
  pull_request:
  workflow_dispatch:
  # Allows this workflow to be reused as a gate by other workflows
  workflow_call:

# The group must not be `github.workflow`-based: when this workflow is reused via
# `workflow_call`, `github.workflow` is the *calling* workflow's name, so the group
# would be identical to the caller's and the call would deadlock waiting on itself.
# Pushes to main are covered by the publish workflow, which calls this one, so there
# is no direct push trigger here to collide with that call either.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Golang
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files need to be formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
